<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PM Studio｜專案排程</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div><p class="brand">PM STUDIO <span>／ PRODUCTION SCHEDULE</span></p><h1 id="schedule-title">專案排程</h1></div>
      <button id="language-toggle" class="language-button" lang="en" aria-label="Switch to English">English</button>
    </header>
    <p id="preview-note" class="preview-note" hidden>示意預覽 · 所有資料皆為虛構</p>
    <section class="schedule" aria-labelledby="schedule-title">
      <div class="toolbar">
        <div class="date-navigation">
          <button id="previous" class="arrow-button" aria-label="查看較早日期">←</button>
          <button id="today-button" class="today-button">今天</button>
          <button id="next" class="arrow-button" aria-label="查看較晚日期">→</button>
        </div>
        <strong id="date-range" class="date-range">—</strong>
        <div class="legend"><span><i class="production-key"></i><span id="legend-production">製作</span></span><span><i class="correction-key"></i><span id="legend-correction">修正</span></span></div>
      </div>
      <div id="load-notice" class="load-notice" role="status"><span id="load-message">正在讀取排程</span><button id="retry" hidden>重試</button></div>
      <div id="timeline-grid" class="timeline-grid" hidden>
        <div id="workspace-labels" class="workspace-labels"></div>
        <div id="timeline-viewport" class="timeline-viewport" tabindex="0" aria-label="排程時間軸，可左右捲動"><div id="timeline-canvas" class="timeline-canvas"></div></div>
      </div>
      <div class="timeline-footer"><span id="visible-count"></span><span id="sync-status" role="status"></span></div>
    </section>
    <section id="pending-section" class="pending-section" hidden aria-labelledby="pending-title">
      <div class="section-heading"><h2 id="pending-title">待排與待確認</h2><span id="pending-count" class="count-badge"></span></div>
      <div id="pending-projects" class="pending-projects"></div>
    </section>
    <footer id="page-footer" class="page-footer">空白時段不代表可預約，檔期須由團隊確認。</footer>
  </main>
  <script type="module" src="/app.mjs"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>PM Studio｜工作區排程</title>
  <script src="/theme.mjs"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div><p class="brand">HIIIO DIGITAL <span>／ PM Studio</span></p><h1>工作區排程</h1></div>
      <div class="header-actions"><span id="sync-status" class="sync-status" role="status">正在讀取排程</span><button id="theme-toggle" class="quiet-button theme-toggle" aria-label="切換亮色" aria-pressed="true">切換亮色</button><button id="refresh" class="quiet-button" aria-label="重新讀取專案資料">重新讀取</button><a id="source-link" class="quiet-button source-link" target="_blank" rel="noopener noreferrer" hidden>專案列表 ↗</a></div>
    </header>

    <div class="mode-bar">
      <div class="segmented mode-switch" role="group" aria-label="資料模式"><button id="demo-mode" aria-pressed="true">示意排程</button><button id="live-mode" aria-pressed="false">專案列表</button></div>
      <p id="mode-description">以示意案件預覽版型，案件與工作區安排均非實際資料。</p>
    </div>

    <div id="notification" class="notification" role="status" hidden></div>

    <section class="schedule" aria-label="工作區時間排程">
      <div class="toolbar">
        <div class="date-navigation"><button id="previous" class="arrow-button" aria-label="往前查看日期">←</button><button id="next" class="arrow-button" aria-label="往後查看日期">→</button><button id="today-button" class="plain-button">今天</button><strong id="date-range">—</strong></div>
        <div class="view-controls"><div class="segmented" role="group" aria-label="時間縮放"><button id="month-view" aria-pressed="true">月</button><button id="week-view" aria-pressed="false">週</button></div><button id="past-toggle" class="plain-button" aria-pressed="false">展開過去日期</button></div>
      </div>
      <div class="filter-bar"><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜尋案號、專案、製作項目" aria-label="搜尋案號、專案、製作項目"></label><div class="legend"><span><i class="production-key"></i>製作</span><span><i class="correction-key"></i>追加修正</span><span class="today-key">│ 今天</span></div></div>
      <div id="timeline-grid" class="timeline-grid">
        <div id="workspace-labels" class="workspace-labels" aria-hidden="true"></div>
        <div id="timeline-viewport" class="timeline-viewport" tabindex="0" aria-label="時間軸，可左右捲動"><div id="timeline-canvas" class="timeline-canvas"></div></div>
      </div>
      <div class="timeline-footer"><span id="visible-count"></span><span>左右捲動查看日期 · 點選方塊查看完整資訊</span></div>
    </section>

    <section id="pending-section" class="pending-section" hidden aria-labelledby="pending-title"><div class="section-heading"><div><h2 id="pending-title">待安排</h2><p id="pending-description">尚未指定工作區，或製作／修正日期仍需安排。</p></div><span id="pending-count" class="count-badge"></span></div><div id="pending-projects" class="pending-projects"></div></section>
    <footer class="page-footer">工作區安排保存在本機；專案日期與狀態以專案列表為準。</footer>
  </main>

  <dialog id="project-dialog" class="project-dialog" aria-labelledby="detail-title">
    <div class="dialog-header"><div><p id="detail-id" class="detail-id"></p><h2 id="detail-title"></h2></div><button id="close-dialog" class="close-button" aria-label="關閉專案詳情">×</button></div>
    <div id="detail-content" class="detail-content"></div>
    <form id="assignment-form" class="assignment-form" hidden><fieldset><legend>安排工作區</legend><div id="workspace-options" class="workspace-options"></div></fieldset><p class="assignment-note">同案可配置多個工作區；只儲存本機配置，不更改日期或狀態。</p><p id="assignment-error" class="assignment-error" role="alert" hidden></p><div class="dialog-actions"><button id="clear-assignment" type="button" class="plain-button">移回待安排</button><button id="save-assignment" type="submit" class="primary-button">儲存工作區</button></div></form>
    <p id="demo-dialog-note" class="demo-dialog-note" hidden>這是示意案件，供確認畫面與操作方式。</p>
  </dialog>
  <script type="module" src="/app.mjs"></script>
</body>
</html>

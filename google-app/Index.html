<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PM Studio｜專案排程</title>
  <style>
:root {
  font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  color-scheme: dark; color: #e4e9ed; background: #161a1e; font-synthesis: none;
  --muted: #a2afb9; --border: #35414b; --surface: #20262b; --blue: #47aff5;
}
* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--border); background: #28313a; border-radius: 8px; }
button:hover { background: #35424c; border-color: #708696; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #77c3ff; outline-offset: 3px; }
[hidden] { display: none !important; }
.app { max-width: 1640px; margin: auto; padding: 38px 40px 24px; }
.app-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
.brand { margin: 0 0 10px; font-size: 11px; letter-spacing: .16em; font-weight: 700; color: #b8c6d1; }
.brand span { margin-left: 8px; font-size: 10px; color: #778c9c; }
h1 { margin: 0; font-size: 29px; letter-spacing: .025em; font-weight: 650; }
.language-button { background: transparent; padding: 8px 12px; color: var(--muted); font-size: 12px; }
.preview-note { padding: 11px 15px; border: 1px solid #78683d; border-radius: 8px; color: #dcc895; font-size: 12px; }
.schedule { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden; }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 18px 20px; }
.date-navigation { display: flex; gap: 5px; }
.date-navigation button { height: 34px; }
.arrow-button { width: 35px; font-size: 17px; }
.today-button { padding: 0 13px; font-size: 12px; }
.date-range { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 15px; color: var(--muted); margin-left: auto; font-size: 11px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 15px; height: 8px; border: 1px solid #a7becf; border-radius: 3px; background: #314354; }
.legend .correction-key { border-color: #d5a373; background: repeating-linear-gradient(135deg,#594131,#594131 3px,#413329 3px,#413329 6px); }
.legend .reservation-key { border: 1px dashed #bbb4df; background: #3c384e; }
.legend .follow-up-key { position: relative; width: 19px; height: 2px; border: 0; background: #d1b676; }
.legend .follow-up-key::after { content: ''; position: absolute; right: 0; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #e0c585; }
.load-notice { padding: 16px 20px; color: #afc7d7; font-size: 13px; display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--border); }
.load-notice.error { color: #efbaa3; background: #322a28; }
.load-notice.warning { color: #d8c099; }
#retry { font-size: 12px; padding: 6px 12px; }
.timeline-grid { display: grid; grid-template-columns: 130px minmax(0,1fr); border-top: 1px solid var(--border); }
.workspace-labels { z-index: 2; background: #222a30; border-right: 1px solid #4a5965; }
.label-axis { height: 68px; padding: 25px 18px; color: #8fa3b2; font-size: 11px; border-bottom: 1px solid var(--border); }
.workspace-label { padding: 21px 17px; border-bottom: 1px solid var(--border); }
.workspace-letter { display: block; font-size: 23px; color: #dbe7ee; font-weight: 500; }
.workspace-description { display: block; margin-top: 6px; line-height: 1.5; color: #90a5b5; font-size: 10px; }
.timeline-viewport { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-color: #566b7c #202b33; scrollbar-width: thin; }
.timeline-canvas { position: relative; isolation: isolate; min-height: 452px; }
.grid-day { position: absolute; top: 38px; bottom: 0; border-left: 1px solid #2c3842; z-index: -2; pointer-events: none; }
.grid-day.weekend { background: #1c252d; }
.grid-day.week-start { border-left-color: #415362; }
.month-label { position: absolute; top: 0; height: 38px; padding: 11px 12px; border-left: 1px solid #4b5c69; border-bottom: 1px solid var(--border); color: #bbcbd7; font-size: 12px; white-space: nowrap; overflow: hidden; background: #222b33; }
.day-label { position: absolute; top: 38px; height: 30px; padding: 8px 0 0 3px; text-align: left; color: #8197a8; font-size: 10px; overflow: hidden; }
.row-rule { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--border); pointer-events: none; }
.today-line { position: absolute; top: 38px; bottom: 0; border-left: 2px solid #2eaafa; pointer-events: none; z-index: 2; }
.today-label { position: absolute; top: 6px; left: 5px; font-size: 9px; color: #67bdf7; background: #1e3546; padding: 3px 5px; border-radius: 4px; white-space: nowrap; }
.project-card { position: absolute; height: 78px; min-width: 0; border: 1px solid #8ea6b7; border-radius: 9px; background: #2b3945; color: #e4edf4; padding: 0; overflow: hidden; text-align: left; box-shadow: 0 3px 9px #0002; }
.card-content { position: absolute; top: 11px; left: 12px; right: 12px; pointer-events: none; }
.project-card.correction { background: repeating-linear-gradient(135deg,#423329,#423329 8px,#3a302a 8px,#3a302a 16px); border-color: #c59366; }
.project-card.reservation { border: 1px dashed #bbb4df; background: #3c384e; }
.project-card.month-start { border-left: 3px dotted #bbcbd7; }
.project-card.month-end { border-right: 3px dotted #bbcbd7; }
.project-card:focus-visible, .project-card:hover { z-index: 5; background: #344958; }
.project-card.correction:focus-visible, .project-card.correction:hover { background: #594334; }
.project-card.reservation:focus-visible, .project-card.reservation:hover { background: #504961; }
.follow-up-stem { position: absolute; height: 2px; background: #d1b676; pointer-events: none; z-index: 1; }
.follow-up-stem.clipped-start::before { content: ''; position: absolute; left: 1px; top: -3px; width: 7px; height: 7px; border-left: 2px solid #d1b676; border-bottom: 2px solid #d1b676; transform: rotate(45deg); }
.follow-up-endpoint { position: absolute; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; padding: 0; z-index: 3; }
.follow-up-endpoint::before { content: ''; position: absolute; left: 15px; top: 15px; width: 14px; height: 14px; border: 2px solid #f1da9f; border-radius: 50%; background: #c9a75f; box-shadow: 0 0 0 4px #20262b; }
.follow-up-endpoint:hover, .follow-up-endpoint:focus-visible { background: #d1b67622; }
.follow-up-label { position: absolute; left: 39px; top: 14px; padding: 2px 5px; border-radius: 4px; background: #20262b; color: #ddc88f; white-space: nowrap; font-size: 11px; line-height: 1.3; }
.project-details { width: min(660px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 25px; border: 1px solid #60788a; border-radius: 14px; color: #e4edf4; background: #263540; box-shadow: 0 16px 50px #0008; }
.project-details::backdrop { background: #09121bbb; }
.project-details h2 { font-size: 20px; color: #e4edf4; padding-right: 30px; overflow-wrap: anywhere; line-height: 1.5; }
.project-fields { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 11px 14px; margin: 18px 0; font-size: 13px; line-height: 1.7; }
.project-fields dt { color: #a6bfce; }
.project-fields dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.details-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; font-size: 21px; line-height: 1; }
.details-customer { color: #a6bfce; font-size: 13px; margin: 8px 0 20px; }
.details-dates { font-size: 13px; line-height: 1.8; font-variant-numeric: tabular-nums; }
.details-workspaces { color: #a6bfce; font-size: 12px; line-height: 1.8; margin-bottom: 0; }
.details-statuses { display: flex; flex-wrap: wrap; gap: 7px; margin: 17px 0; }
.status-tag { color: #edd7a2; border: 1px solid #7f704e; border-radius: 6px; background: #39382f; padding: 6px 8px; font-size: 12px; }
.details-note { color: #a6bfce; font-size: 12px; line-height: 1.7; }
.card-heading { display: flex; gap: 9px; align-items: center; white-space: nowrap; line-height: 1.4; }
.card-id { font-weight: 650; font-size: 13px; }
.customer-code { font-size: 10px; color: #a6bfce; font-weight: 400; }
.card-dates { display: block; white-space: nowrap; margin-top: 6px; font-size: 10px; color: #bbcbd6; font-variant-numeric: tabular-nums; }
.card-meta { display: block; white-space: nowrap; margin-top: 4px; font-size: 9px; color: #93a9b9; }
.empty-row { position: absolute; left: 16px; color: #647d8e; font-size: 11px; }
.timeline-footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 13px 20px; border-top: 1px solid var(--border); color: #849aa9; font-size: 10px; }
.pending-section { margin-top: 28px; }
.section-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 13px; }
h2 { margin: 0; font-size: 15px; font-weight: 600; color: #b7c7d3; }
.count-badge { border: 1px solid var(--border); border-radius: 12px; padding: 1px 7px; font-size: 10px; color: #91a7b6; }
.pending-projects { display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap: 10px; }
.pending-card { border: 1px solid var(--border); background: #1c242b; padding: 14px 16px; border-radius: 10px; }
.pending-card .card-heading { flex-wrap: wrap; white-space: normal; }
.pending-details { margin-top: 11px; padding: 6px 10px; font-size: 11px; }
.pending-reason { font-size: 11px; color: #b9a38a; margin: 8px 0 5px; line-height: 1.6; }
.pending-dates { font-size: 10px; line-height: 1.8; color: #8fa6b6; margin: 0; font-variant-numeric: tabular-nums; }
.page-footer { margin-top: 22px; color: #7d929f; font-size: 11px; line-height: 1.6; }
@media (max-width: 700px) {
  .app { padding: 23px 12px 18px; }
  .app-header { margin-bottom: 20px; }
  .brand { font-size: 10px; }
  .brand span { display: none; }
  h1 { font-size: 23px; }
  .toolbar { padding: 12px; gap: 10px; }
  .date-range { font-size: 11px; }
  .legend { width: 100%; margin-left: 0; font-size: 10px; }
  .timeline-grid { grid-template-columns: 82px minmax(0,1fr); }
  .workspace-label { padding: 17px 10px; }
  .workspace-letter { font-size: 21px; }
  .workspace-description { font-size: 9px; }
  .label-axis { padding: 25px 10px; font-size: 10px; }
  .timeline-footer { padding: 12px; line-height: 1.6; }
  .pending-projects { grid-template-columns: 1fr; }
  .project-fields { grid-template-columns: 1fr; gap: 2px; }
  .project-fields dd { margin-bottom: 10px; }
}
</style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div><p class="brand">PM STUDIO <span>／ PRODUCTION SCHEDULE</span></p><h1 id="schedule-title">專案排程</h1></div>
      <button id="language-toggle" class="language-button" lang="en" aria-label="Switch to English">English</button>
    </header>
    <p id="preview-note" class="preview-note" hidden>示意預覽 · 所有資料皆為虛構</p>
    <section class="schedule" aria-labelledby="schedule-title">
      <div class="toolbar">
        <div class="date-navigation">
          <button id="previous" class="arrow-button" aria-label="查看較早日期">←</button>
          <button id="today-button" class="today-button">今天</button>
          <button id="next" class="arrow-button" aria-label="查看較晚日期">→</button>
        </div>
        <strong id="date-range" class="date-range">—</strong>
        <div class="legend"><span><i class="production-key"></i><span id="legend-production">製作</span></span><span><i class="correction-key"></i><span id="legend-correction">修正</span></span><span><i class="reservation-key"></i><span id="legend-reservation">時段預約</span></span><span><i class="follow-up-key"></i><span id="legend-follow-up">後續追蹤</span></span></div>
      </div>
      <div id="load-notice" class="load-notice" role="status"><span id="load-message">正在讀取排程</span><button id="retry" hidden>重試</button></div>
      <div id="timeline-grid" class="timeline-grid" hidden>
        <div id="workspace-labels" class="workspace-labels"></div>
        <div id="timeline-viewport" class="timeline-viewport" tabindex="0" aria-label="排程時間軸，可左右捲動"><div id="timeline-canvas" class="timeline-canvas"></div></div>
      </div>
      <div class="timeline-footer"><span id="visible-count"></span><span id="sync-status" role="status"></span></div>
    </section>
    <section id="pending-section" class="pending-section" hidden aria-labelledby="pending-title">
      <div class="section-heading"><h2 id="pending-title">待排與待確認</h2><span id="pending-count" class="count-badge"></span></div>
      <div id="pending-projects" class="pending-projects"></div>
    </section>
    <footer id="page-footer" class="page-footer">空白時段不代表可預約，檔期須由團隊確認。</footer>
  </main>
  <script>
// Generated from PM Studio sources. No project records are embedded.
(async () => {
const TIMELINE_DAYS = 210;
const TIMELINE_AXIS_HEIGHT = 68;
const TIMELINE_LANE_HEIGHT = 94;

function timelineScale(viewportWidth) {
  const width = Math.max(1, Number(viewportWidth) || 1);
  const visibleDays = width <= 560 ? 42 : 84;
  return { viewportWidth: width, visibleDays, dayWidth: width / visibleDays };
}
function timelineScrollPosition(firstDay, scrollLeft, dayWidth) {
  const offset = Math.max(0, scrollLeft) / dayWidth;
  const wholeDays = Math.floor(offset + 1e-7);
  return { day: firstDay + wholeDays, fraction: Math.max(0, offset - wholeDays) };
}

function timelineDay(value) {
  if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
  const date = new Date(value + 'T00:00:00Z');
  return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value ? Math.floor(date.getTime() / 86400000) : null;
}
function timelineDate(day) { return new Date(day * 86400000).toISOString().slice(0, 10); }
function preciseTimelineRange(start, end) {
  const first = timelineDay(start), last = timelineDay(end);
  return first !== null && last !== null && first <= last ? { first, last } : null;
}
function timelineDateBounds(value) {
  const day = timelineDay(value);
  if (day !== null) return { first: day, last: day, precision: 'day' };
  if (typeof value !== 'string' || !/^\d{4}-\d{2}$/.test(value)) return null;
  const first = timelineDay(value + '-01');
  if (first === null) return null;
  const nextMonth = new Date(first * 86400000);
  nextMonth.setUTCMonth(nextMonth.getUTCMonth() + 1);
  return { first, last: Math.floor(nextMonth.getTime() / 86400000) - 1, precision: 'month' };
}
function timelineRange(start, end) {
  const beginning = timelineDateBounds(start), ending = timelineDateBounds(end);
  return beginning && ending && beginning.first <= ending.last
    ? { first: beginning.first, last: ending.last, startPrecision: beginning.precision, endPrecision: ending.precision } : null;
}
function taipeiToday(now = new Date()) {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(now);
  return ['year', 'month', 'day'].map((key) => parts.find((part) => part.type === key).value).join('-');
}
function projectPhases(project) {
  return [
    { phase: project.scheduleKind === 'reservation' ? 'reservation' : 'production', start: project.start, end: project.end },
    { phase: 'correction', start: project.correctionStart, end: project.correctionEnd },
  ].flatMap((phase) => { const range = timelineRange(phase.start, phase.end); return range ? [{ ...phase, ...range }] : []; });
}
function projectFollowUp(project, today) {
  if (!project.followUp?.length || !Number.isFinite(today) || !timelineRange(project.start, project.end)) return null;
  // An unknown revision end cannot be treated as completed work.
  if (project.pendingReasons.includes('correction-dates') || ((project.correctionStart || project.correctionEnd) && !timelineRange(project.correctionStart, project.correctionEnd))) return null;
  const phases = projectPhases(project);
  const anchor = phases.reduce((latest, phase) => !latest || phase.last > latest.last ? phase : latest, null);
  if (!anchor || anchor.last >= today) return null;
  return { phase: 'followUp', first: anchor.last + 1, last: today, anchor, project };
}
function projectPendingReasons(project) {
  const reasons = new Set(project.pendingReasons);
  if (!project.workspaceIds.length) reasons.add('no-workspace');
  if (!timelineRange(project.start, project.end)) reasons.add('production-dates');
  if ((project.correctionStart || project.correctionEnd) && !timelineRange(project.correctionStart, project.correctionEnd)) reasons.add('correction-dates');
  if (!project.customerCode) reasons.add('customer-code');
  return [...reasons];
}
function buildTimelineLayout(projects, workspaces, firstDay, { dayWidth, days = TIMELINE_DAYS, today = null }) {
  if (!Number.isFinite(dayWidth) || dayWidth <= 0) throw new Error('Invalid timeline scale.');
  let top = TIMELINE_AXIS_HEIGHT;
  const lastDay = firstDay + days - 1;
  const inset = Math.min(2, dayWidth * .12);
  const rows = workspaces.map((workspace) => {
    const groups = projects.filter((project) => project.workspaceIds.includes(workspace.id)).map((project) => {
      const phases = projectPhases(project).map((phase) => ({ ...phase, project }));
      const phaseLaneEnds = [];
      for (const phase of [...phases].sort((a, b) => a.first - b.first || a.last - b.last)) {
        let phaseLane = phaseLaneEnds.findIndex((end) => end < phase.first);
        if (phaseLane < 0) phaseLane = phaseLaneEnds.length;
        phaseLaneEnds[phaseLane] = phase.last;
        phase.phaseLane = phaseLane;
      }
      const followUp = projectFollowUp(project, today);
      const items = [...phases, ...(followUp ? [followUp] : [])];
      return { project, phases, followUp, laneCount: phaseLaneEnds.length, first: Math.min(...items.map((item) => item.first)), last: Math.max(...items.map((item) => item.last)) };
    }).filter((group) => [...group.phases, ...(group.followUp ? [group.followUp] : [])].some((item) => item.last >= firstDay && item.first <= lastDay))
      .sort((a, b) => a.first - b.first || a.last - b.last || a.project.id.localeCompare(b.project.id));
    const blocks = [], followUps = [];
    const laneEnds = [];
    for (const group of groups) {
      // Keep a project's phases and tracking line together, with room for its endpoint.
      let lane = 0;
      while (Array.from({ length: group.laneCount }, (_, offset) => laneEnds[lane + offset]).some((end) => end !== undefined && end >= group.first)) lane++;
      for (let offset = 0; offset < group.laneCount; offset++) laneEnds[lane + offset] = group.last + (group.followUp ? 110 / dayWidth : 0);
      for (const block of group.phases.filter((phase) => phase.last >= firstDay && phase.first <= lastDay)) {
        block.lane = lane + block.phaseLane;
        block.left = (Math.max(firstDay, block.first) - firstDay) * dayWidth + inset;
        block.width = (Math.min(lastDay, block.last) - Math.max(firstDay, block.first) + 1) * dayWidth - 2 * inset;
        block.top = top + 12 + block.lane * TIMELINE_LANE_HEIGHT;
        blocks.push(block);
      }
      const followUp = group.followUp;
      if (followUp && followUp.last >= firstDay && followUp.first <= lastDay) {
        followUp.lane = lane + group.phases.find((phase) => phase.phase === followUp.anchor.phase).phaseLane;
        followUp.left = Math.max(0, (followUp.first - firstDay) * dayWidth - inset);
        const end = Math.min((today - firstDay + .5) * dayWidth, days * dayWidth);
        followUp.width = Math.max(0, end - followUp.left);
        followUp.top = top + 51 + followUp.lane * TIMELINE_LANE_HEIGHT;
        followUp.endpointVisible = today >= firstDay && today <= lastDay;
        followUp.clippedStart = followUp.first < firstDay;
        followUps.push(followUp);
      }
    }
    const height = Math.max(1, laneEnds.length) * TIMELINE_LANE_HEIGHT + 18;
    const row = { workspace, top, height, blocks, followUps };
    top += height;
    return row;
  });
  return { rows, height: top, width: days * dayWidth, firstDay, lastDay, dayWidth };
}

const PENDING_REASONS = Object.freeze(['no-workspace', 'workspace-values', 'production-dates', 'correction-dates', 'customer-code', 'customer-type', 'schedule-kind', 'follow-up-values']);
const CUSTOMER_TYPES = Object.freeze(['VTuber個人', 'VTuber公司', '遊戲公司', '其他']);
const PROJECT_DETAIL_FIELDS = Object.freeze(['name', 'customer', 'owner', 'status', 'deliveryGoal', 'notes', 'contact', 'assignee', 'deliverySteps']);
const SCHEDULE_WARNINGS = Object.freeze(['project-id-missing', 'project-id-invalid']);
const SCHEDULE_KINDS = Object.freeze(['production', 'reservation']);
const FOLLOW_UP_STATUSES = Object.freeze(['customer-confirmation', 'payment']);
function scheduleKeys(value, allowed, required = allowed) {
  if (!value || typeof value !== 'object' || Array.isArray(value) || Object.keys(value).some((key) => !allowed.includes(key)) || required.some((key) => !(key in value))) throw new Error('Invalid schedule fields.');
}
function scheduleDateValue(value) {
  if (typeof value !== 'string' || (value !== '' && !/^\d{4}-\d{2}(?:-\d{2})?$/.test(value))) throw new Error('Invalid schedule date.');
  return value;
}
function normalizeTimelinePayload(payload) {
  scheduleKeys(payload, ['schemaVersion', 'today', 'syncedAt', 'projects', 'workspaces', 'warnings']);
  if (payload.schemaVersion !== 3 || !/^\d{4}-\d{2}-\d{2}$/.test(payload.today) || !Number.isFinite(new Date(payload.today + 'T00:00:00Z').getTime()) || new Date(payload.today + 'T00:00:00Z').toISOString().slice(0, 10) !== payload.today) throw new Error('Invalid schedule version or day.');
  if (typeof payload.syncedAt !== 'string' || !Number.isFinite(Date.parse(payload.syncedAt))) throw new Error('Invalid read time.');
  if (!Array.isArray(payload.workspaces) || payload.workspaces.length !== 4) throw new Error('Invalid workspaces.');
  const workspaces = payload.workspaces.map((space, index) => {
    scheduleKeys(space, ['id', 'name', 'usualLoad'], ['id', 'name']);
    if (space.id !== ['A', 'B', 'C', 'D'][index] || typeof space.name !== 'string' || space.name.length > 80) throw new Error('Invalid workspace.');
    if ('usualLoad' in space && (!Number.isInteger(space.usualLoad) || space.usualLoad < 1)) throw new Error('Invalid usual load.');
    return { ...space };
  });
  if (!Array.isArray(payload.warnings) || payload.warnings.some((value) => !SCHEDULE_WARNINGS.includes(value))) throw new Error('Invalid warning.');
  if (!Array.isArray(payload.projects) || payload.projects.length > 1000) throw new Error('Invalid projects.');
  const ids = new Set();
  const projects = payload.projects.map((project) => {

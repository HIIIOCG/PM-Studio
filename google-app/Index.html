<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PM Studio｜專案排程</title>
  <style>
:root {
  font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  color-scheme: dark; color: #e4e9ed; background: #161a1e; font-synthesis: none;
  --muted: #a2afb9; --border: #35414b; --surface: #20262b; --blue: #47aff5;
}
* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--border); background: #28313a; border-radius: 8px; }
button:hover { background: #35424c; border-color: #708696; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #77c3ff; outline-offset: 3px; }
[hidden] { display: none !important; }
.app { max-width: 1640px; margin: auto; padding: 38px 40px 24px; }
.app-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
.brand { margin: 0 0 10px; font-size: 11px; letter-spacing: .16em; font-weight: 700; color: #b8c6d1; }
.brand span { margin-left: 8px; font-size: 10px; color: #778c9c; }
h1 { margin: 0; font-size: 29px; letter-spacing: .025em; font-weight: 650; }
.language-button { background: transparent; padding: 8px 12px; color: var(--muted); font-size: 12px; }
.preview-note { padding: 11px 15px; border: 1px solid #78683d; border-radius: 8px; color: #dcc895; font-size: 12px; }
.schedule { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden; }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 18px 20px; }
.date-navigation { display: flex; gap: 5px; }
.date-navigation button { height: 34px; }
.arrow-button { width: 35px; font-size: 17px; }
.today-button { padding: 0 13px; font-size: 12px; }
.date-range { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 15px; color: var(--muted); margin-left: auto; font-size: 11px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 15px; height: 8px; border: 1px solid #a7becf; border-radius: 3px; background: #314354; }
.legend .correction-key { border-color: #d5a373; background: repeating-linear-gradient(135deg,#594131,#594131 3px,#413329 3px,#413329 6px); }
.load-notice { padding: 16px 20px; color: #afc7d7; font-size: 13px; display: flex; align-items: center; gap: 14px; border-top: 1px solid var(--border); }
.load-notice.error { color: #efbaa3; background: #322a28; }
.load-notice.warning { color: #d8c099; }
#retry { font-size: 12px; padding: 6px 12px; }
.timeline-grid { display: grid; grid-template-columns: 130px minmax(0,1fr); border-top: 1px solid var(--border); }
.workspace-labels { z-index: 2; background: #222a30; border-right: 1px solid #4a5965; }
.label-axis { height: 68px; padding: 25px 18px; color: #8fa3b2; font-size: 11px; border-bottom: 1px solid var(--border); }
.workspace-label { padding: 21px 17px; border-bottom: 1px solid var(--border); }
.workspace-letter { display: block; font-size: 23px; color: #dbe7ee; font-weight: 500; }
.workspace-description { display: block; margin-top: 6px; line-height: 1.5; color: #90a5b5; font-size: 10px; }
.timeline-viewport { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-color: #566b7c #202b33; scrollbar-width: thin; }
.timeline-canvas { position: relative; isolation: isolate; min-height: 452px; }
.grid-day { position: absolute; top: 38px; bottom: 0; border-left: 1px solid #2c3842; z-index: -2; pointer-events: none; }
.grid-day.weekend { background: #1c252d; }
.grid-day.week-start { border-left-color: #415362; }
.month-label { position: absolute; top: 0; height: 38px; padding: 11px 12px; border-left: 1px solid #4b5c69; border-bottom: 1px solid var(--border); color: #bbcbd7; font-size: 12px; white-space: nowrap; overflow: hidden; background: #222b33; }
.day-label { position: absolute; top: 38px; height: 30px; padding: 8px 0 0 3px; text-align: left; color: #8197a8; font-size: 10px; overflow: hidden; }
.row-rule { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--border); pointer-events: none; }
.today-line { position: absolute; top: 38px; bottom: 0; border-left: 2px solid #2eaafa; pointer-events: none; z-index: 2; }
.today-label { position: absolute; top: 6px; left: 5px; font-size: 9px; color: #67bdf7; background: #1e3546; padding: 3px 5px; border-radius: 4px; white-space: nowrap; }
.project-card { position: absolute; height: 78px; min-width: 0; border: 1px solid #8ea6b7; border-radius: 9px; background: #2b3945; color: #e4edf4; padding: 0; overflow: hidden; text-align: left; box-shadow: 0 3px 9px #0002; }
.card-content { position: absolute; top: 11px; left: 12px; right: 12px; pointer-events: none; }
.project-card.correction { background: repeating-linear-gradient(135deg,#423329,#423329 8px,#3a302a 8px,#3a302a 16px); border-color: #c59366; }
.project-card:focus-visible, .project-card:hover { z-index: 5; background: #344958; }
.project-card.correction:focus-visible, .project-card.correction:hover { background: #594334; }
.project-details { width: min(400px, calc(100vw - 32px)); padding: 25px; border: 1px solid #60788a; border-radius: 14px; color: #e4edf4; background: #263540; box-shadow: 0 16px 50px #0008; }
.project-details::backdrop { background: #09121bbb; }
.project-details h2 { font-size: 20px; color: #e4edf4; padding-right: 30px; }
.details-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; font-size: 21px; line-height: 1; }
.details-customer { color: #a6bfce; font-size: 13px; margin: 8px 0 20px; }
.details-dates { font-size: 13px; line-height: 1.8; font-variant-numeric: tabular-nums; }
.details-workspaces { color: #a6bfce; font-size: 12px; line-height: 1.8; margin-bottom: 0; }
.card-heading { display: flex; gap: 9px; align-items: center; white-space: nowrap; line-height: 1.4; }
.card-id { font-weight: 650; font-size: 13px; }
.customer-code { font-size: 10px; color: #a6bfce; font-weight: 400; }
.card-dates { display: block; white-space: nowrap; margin-top: 6px; font-size: 10px; color: #bbcbd6; font-variant-numeric: tabular-nums; }
.card-meta { display: block; white-space: nowrap; margin-top: 4px; font-size: 9px; color: #93a9b9; }
.empty-row { position: absolute; left: 16px; color: #647d8e; font-size: 11px; }
.timeline-footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 13px 20px; border-top: 1px solid var(--border); color: #849aa9; font-size: 10px; }
.pending-section { margin-top: 28px; }
.section-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 13px; }
h2 { margin: 0; font-size: 15px; font-weight: 600; color: #b7c7d3; }
.count-badge { border: 1px solid var(--border); border-radius: 12px; padding: 1px 7px; font-size: 10px; color: #91a7b6; }
.pending-projects { display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap: 10px; }
.pending-card { border: 1px solid var(--border); background: #1c242b; padding: 14px 16px; border-radius: 10px; }
.pending-reason { font-size: 11px; color: #b9a38a; margin: 8px 0 5px; line-height: 1.6; }
.pending-dates { font-size: 10px; line-height: 1.8; color: #8fa6b6; margin: 0; font-variant-numeric: tabular-nums; }
.page-footer { margin-top: 22px; color: #7d929f; font-size: 11px; line-height: 1.6; }
@media (max-width: 700px) {
  .app { padding: 23px 12px 18px; }
  .app-header { margin-bottom: 20px; }
  .brand { font-size: 10px; }
  .brand span { display: none; }
  h1 { font-size: 23px; }
  .toolbar { padding: 12px; gap: 10px; }
  .date-range { font-size: 11px; }
  .legend { width: 100%; margin-left: 0; font-size: 10px; }
  .timeline-grid { grid-template-columns: 82px minmax(0,1fr); }
  .workspace-label { padding: 17px 10px; }
  .workspace-letter { font-size: 21px; }
  .workspace-description { font-size: 9px; }
  .label-axis { padding: 25px 10px; font-size: 10px; }
  .timeline-footer { padding: 12px; line-height: 1.6; }
  .pending-projects { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div><p class="brand">PM STUDIO <span>／ PRODUCTION SCHEDULE</span></p><h1 id="schedule-title">專案排程</h1></div>
      <button id="language-toggle" class="language-button" lang="en" aria-label="Switch to English">English</button>
    </header>
    <p id="preview-note" class="preview-note" hidden>示意預覽 · 所有資料皆為虛構</p>
    <section class="schedule" aria-labelledby="schedule-title">
      <div class="toolbar">
        <div class="date-navigation">
          <button id="previous" class="arrow-button" aria-label="查看較早日期">←</button>
          <button id="today-button" class="today-button">今天</button>
          <button id="next" class="arrow-button" aria-label="查看較晚日期">→</button>
        </div>
        <strong id="date-range" class="date-range">—</strong>
        <div class="legend"><span><i class="production-key"></i><span id="legend-production">製作</span></span><span><i class="correction-key"></i><span id="legend-correction">修正</span></span></div>
      </div>
      <div id="load-notice" class="load-notice" role="status"><span id="load-message">正在讀取排程</span><button id="retry" hidden>重試</button></div>
      <div id="timeline-grid" class="timeline-grid" hidden>
        <div id="workspace-labels" class="workspace-labels"></div>
        <div id="timeline-viewport" class="timeline-viewport" tabindex="0" aria-label="排程時間軸，可左右捲動"><div id="timeline-canvas" class="timeline-canvas"></div></div>
      </div>
      <div class="timeline-footer"><span id="visible-count"></span><span id="sync-status" role="status"></span></div>
    </section>
    <section id="pending-section" class="pending-section" hidden aria-labelledby="pending-title">
      <div class="section-heading"><h2 id="pending-title">待排與待確認</h2><span id="pending-count" class="count-badge"></span></div>
      <div id="pending-projects" class="pending-projects"></div>
    </section>
    <footer id="page-footer" class="page-footer">空白時段不代表可預約，檔期須由團隊確認。</footer>
  </main>
  <script>
// Generated from PM Studio sources. No project records are embedded.
(async () => {
const TIMELINE_DAYS = 210;
const TIMELINE_AXIS_HEIGHT = 68;
const TIMELINE_LANE_HEIGHT = 94;

function timelineScale(viewportWidth) {
  const width = Math.max(1, Number(viewportWidth) || 1);
  const visibleDays = width <= 560 ? 42 : 84;
  return { viewportWidth: width, visibleDays, dayWidth: width / visibleDays };
}
function timelineScrollPosition(firstDay, scrollLeft, dayWidth) {
  const offset = Math.max(0, scrollLeft) / dayWidth;
  const wholeDays = Math.floor(offset + 1e-7);
  return { day: firstDay + wholeDays, fraction: Math.max(0, offset - wholeDays) };
}

function timelineDay(value) {
  if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
  const date = new Date(value + 'T00:00:00Z');
  return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value ? Math.floor(date.getTime() / 86400000) : null;
}
function timelineDate(day) { return new Date(day * 86400000).toISOString().slice(0, 10); }
function preciseTimelineRange(start, end) {
  const first = timelineDay(start), last = timelineDay(end);
  return first !== null && last !== null && first <= last ? { first, last } : null;
}
function projectPhases(project) {
  return [
    { phase: 'production', start: project.start, end: project.end },
    { phase: 'correction', start: project.correctionStart, end: project.correctionEnd },
  ].flatMap((phase) => { const range = preciseTimelineRange(phase.start, phase.end); return range ? [{ ...phase, ...range }] : []; });
}
function projectPendingReasons(project) {
  const reasons = new Set(project.pendingReasons);
  if (!project.workspaceIds.length) reasons.add('no-workspace');
  if (!preciseTimelineRange(project.start, project.end)) reasons.add('production-dates');
  if ((project.correctionStart || project.correctionEnd) && !preciseTimelineRange(project.correctionStart, project.correctionEnd)) reasons.add('correction-dates');
  if (!project.customerCode) reasons.add('customer-code');
  return [...reasons];
}
function buildTimelineLayout(projects, workspaces, firstDay, { dayWidth, days = TIMELINE_DAYS }) {
  if (!Number.isFinite(dayWidth) || dayWidth <= 0) throw new Error('Invalid timeline scale.');
  let top = TIMELINE_AXIS_HEIGHT;
  const lastDay = firstDay + days - 1;
  const inset = Math.min(2, dayWidth * .12);
  const rows = workspaces.map((workspace) => {
    const blocks = projects.filter((project) => project.workspaceIds.includes(workspace.id))
      .flatMap((project) => projectPhases(project).filter((phase) => phase.last >= firstDay && phase.first <= lastDay).map((phase) => ({ ...phase, project })))
      .sort((a, b) => a.first - b.first || a.last - b.last || a.project.id.localeCompare(b.project.id) || a.phase.localeCompare(b.phase));
    const laneEnds = [];
    for (const block of blocks) {
      let lane = laneEnds.findIndex((end) => end < block.first);
      if (lane < 0) lane = laneEnds.length;
      laneEnds[lane] = block.last;
      block.lane = lane;
      block.left = (Math.max(firstDay, block.first) - firstDay) * dayWidth + inset;
      block.width = (Math.min(lastDay, block.last) - Math.max(firstDay, block.first) + 1) * dayWidth - 2 * inset;
      block.top = top + 12 + lane * TIMELINE_LANE_HEIGHT;
    }
    const height = Math.max(1, laneEnds.length) * TIMELINE_LANE_HEIGHT + 18;
    const row = { workspace, top, height, blocks };
    top += height;
    return row;
  });
  return { rows, height: top, width: days * dayWidth, firstDay, lastDay, dayWidth };
}

const PENDING_REASONS = Object.freeze(['no-workspace', 'workspace-values', 'production-dates', 'correction-dates', 'customer-code']);
const SCHEDULE_WARNINGS = Object.freeze(['project-id-missing', 'project-id-invalid']);
function scheduleKeys(value, allowed, required = allowed) {
  if (!value || typeof value !== 'object' || Array.isArray(value) || Object.keys(value).some((key) => !allowed.includes(key)) || required.some((key) => !(key in value))) throw new Error('Invalid schedule fields.');
}
function scheduleDateValue(value) {
  if (typeof value !== 'string' || (value !== '' && !/^\d{4}-\d{2}(?:-\d{2})?$/.test(value))) throw new Error('Invalid schedule date.');
  return value;
}
function normalizeTimelinePayload(payload) {
  scheduleKeys(payload, ['schemaVersion', 'today', 'syncedAt', 'projects', 'workspaces', 'warnings']);
  if (payload.schemaVersion !== 2 || !/^\d{4}-\d{2}-\d{2}$/.test(payload.today) || !Number.isFinite(new Date(payload.today + 'T00:00:00Z').getTime()) || new Date(payload.today + 'T00:00:00Z').toISOString().slice(0, 10) !== payload.today) throw new Error('Invalid schedule version or day.');
  if (typeof payload.syncedAt !== 'string' || !Number.isFinite(Date.parse(payload.syncedAt))) throw new Error('Invalid read time.');
  if (!Array.isArray(payload.workspaces) || payload.workspaces.length !== 4) throw new Error('Invalid workspaces.');
  const workspaces = payload.workspaces.map((space, index) => {
    scheduleKeys(space, ['id', 'name', 'usualLoad'], ['id', 'name']);
    if (space.id !== ['A', 'B', 'C', 'D'][index] || typeof space.name !== 'string' || space.name.length > 80) throw new Error('Invalid workspace.');
    if ('usualLoad' in space && (!Number.isInteger(space.usualLoad) || space.usualLoad < 1)) throw new Error('Invalid usual load.');
    return { ...space };
  });
  if (!Array.isArray(payload.warnings) || payload.warnings.some((value) => !SCHEDULE_WARNINGS.includes(value))) throw new Error('Invalid warning.');
  if (!Array.isArray(payload.projects) || payload.projects.length > 1000) throw new Error('Invalid projects.');
  const ids = new Set();
  const projects = payload.projects.map((project) => {
    scheduleKeys(project, ['id', 'customerCode', 'start', 'end', 'correctionStart', 'correctionEnd', 'workspaceIds', 'workspaceUnits', 'pendingReasons']);
    if (typeof project.id !== 'string' || !/^(?:C|BG|P|D|O)-\d{3,}$/.test(project.id) || ids.has(project.id)) throw new Error('Invalid project ID.');
    ids.add(project.id);
    if (typeof project.customerCode !== 'string' || (project.customerCode !== '' && !/^[A-Z]+-\d+$/.test(project.customerCode))) throw new Error('Invalid customer code.');
    for (const key of ['start', 'end', 'correctionStart', 'correctionEnd']) scheduleDateValue(project[key]);
    if (!Array.isArray(project.workspaceIds) || new Set(project.workspaceIds).size !== project.workspaceIds.length || project.workspaceIds.some((id) => !['A', 'B', 'C', 'D'].includes(id))) throw new Error('Invalid workspace assignment.');
    scheduleKeys(project.workspaceUnits, project.workspaceIds);
    if (Object.values(project.workspaceUnits).some((value) => !Number.isSafeInteger(value) || value < 1)) throw new Error('Invalid workspace units.');
    if (!Array.isArray(project.pendingReasons) || project.pendingReasons.some((value) => !PENDING_REASONS.includes(value))) throw new Error('Invalid pending reason.');
    return { ...project, workspaceIds: [...project.workspaceIds], workspaceUnits: { ...project.workspaceUnits }, pendingReasons: [...new Set(project.pendingReasons)] };
  });
  return { schemaVersion: 2, today: payload.today, syncedAt: payload.syncedAt, workspaces, projects, warnings: [...new Set(payload.warnings)] };
}

function createGoogleBridge(runner = globalThis.google?.script?.run) {
  return function readTimeline() {
    return new Promise((resolve, reject) => {
      if (!runner || typeof runner.withSuccessHandler !== 'function') { reject(new Error('Schedule service is unavailable.')); return; }
      runner.withSuccessHandler(resolve).withFailureHandler(() => reject(new Error('Schedule service is unavailable.'))).getTimeline();
    });
  };
}

const SCHEDULE_TEXT = {
  title: ['專案排程', 'Project schedule'],
  previous: ['查看較早日期', 'View earlier dates'],
  next: ['查看較晚日期', 'View later dates'],
  today: ['今天', 'Today'],
  workspace: ['工作區', 'Workspace'],
  production: ['製作', 'Production'],
  correction: ['修正', 'Revisions'],
  pending: ['待排與待確認', 'To be scheduled / confirmed'],
  loading: ['正在讀取排程', 'Loading schedule'],
  loadError: ['無法讀取排程，請稍後重試。', 'Unable to load the schedule. Please try again.'],
  staleError: ['更新失敗，目前顯示上次讀取的資料。', 'Reload failed. Showing the last successful read.'],
  retry: ['重試', 'Retry'],
  empty: ['目前沒有專案資料。', 'No projects are available yet.'],
  warning: ['部分資料待確認，排程可能不完整。', 'Some data needs confirmation; the schedule may be incomplete.'],
  loaded: ['讀取時間', 'Read at'],
  stale: ['上次讀取', 'Previous read'],
  visible: ['目前區間 {count} 案', '{count} projects in view'],
  footer: ['空白時段不代表可預約，檔期須由團隊確認。', 'Empty time spans do not confirm availability. Please contact the team.'],
  timeline: ['排程時間軸，可左右捲動', 'Schedule timeline; scroll horizontally to explore dates'],
  customer: ['客戶 {code}', 'Client {code}'],
  missingCustomer: ['客戶編號待確認', 'Client code pending'],
  unspecified: ['未定', 'Pending'],
  noWork: ['此區間未排工作', 'No work in this period'],
  preview: ['示意預覽 · 所有資料皆為虛構', 'Preview · All data is fictional'],
  'no-workspace': ['工作區未安排', 'Workspace not assigned'],
  'workspace-values': ['工作區占用待確認', 'Workspace allocation needs confirmation'],
  'production-dates': ['製作日期待確認', 'Production dates need confirmation'],
  'correction-dates': ['修正日期待確認', 'Revision dates need confirmation'],
  'customer-code': ['客戶編號待確認', 'Client code needs confirmation'],
};
let scheduleLanguage = 'zh-Hant';
function setScheduleLanguage(language) { scheduleLanguage = language === 'en' ? 'en' : 'zh-Hant'; return scheduleLanguage; }
function getScheduleLanguage() { return scheduleLanguage; }
function scheduleText(key, values = {}) {
  return (SCHEDULE_TEXT[key]?.[scheduleLanguage === 'en' ? 1 : 0] || key).replace(/\{(\w+)\}/g, (_, name) => String(values[name] ?? ''));
}
function workspaceText(id) {
  return ({ A: ['角色模型', 'Characters'], B: ['角色模型', 'Characters'], C: ['角色・場景', 'Characters / scenes'], D: ['CT 美術', 'CT art'] })[id]?.[scheduleLanguage === 'en' ? 1 : 0] || id;
}
function scheduleMonth(day) {
  return new Intl.DateTimeFormat(scheduleLanguage === 'en' ? 'en-US' : 'zh-TW', { timeZone: 'UTC', year: 'numeric', month: 'short' }).format(new Date(day * 86400000));
}
function scheduleReadTime(value) {
  const date = new Date(value);
  if (!Number.isFinite(date.getTime())) return '';
  return new Intl.DateTimeFormat(scheduleLanguage === 'en' ? 'en-GB' : 'zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(date);
}

const scheduleElement = (id) => document.getElementById(id);
const scheduleState = { payload: null, firstDay: null, loading: false, failed: false, layout: null, scale: null, viewPosition: null };
const readSchedule = createGoogleBridge();
let scheduleDetailsDialog;
function scheduleNode(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function projectIdentity(project) { return project.customerCode ? scheduleText('customer', { code: project.customerCode }) : scheduleText('missingCustomer'); }
function rangeText(start, end) { return (start || scheduleText('unspecified')) + ' → ' + (end || scheduleText('unspecified')); }
function showScheduleDetails(block) {
  if (!scheduleDetailsDialog) {
    scheduleDetailsDialog = scheduleNode('dialog', 'project-details');
    scheduleDetailsDialog.setAttribute('id', 'project-details');
    scheduleDetailsDialog.setAttribute('aria-labelledby', 'project-details-title');
    document.querySelector('main').append(scheduleDetailsDialog);
  }
  const project = block.project;
  const heading = scheduleNode('h2', '', project.id);
  heading.setAttribute('id', 'project-details-title');
  const close = scheduleNode('button', 'details-close', '×');
  close.setAttribute('id', 'close-project-details');
  close.setAttribute('type', 'button');
  close.setAttribute('aria-label', getScheduleLanguage() === 'en' ? 'Close project details' : '關閉專案資訊');
  close.addEventListener('click', () => scheduleDetailsDialog.close());
  const areas = project.workspaceIds.map((id) => id + ' × ' + project.workspaceUnits[id]).join(' · ');
  scheduleDetailsDialog.replaceChildren(close, heading,
    scheduleNode('p', 'details-customer', projectIdentity(project)),
    scheduleNode('p', 'details-dates', scheduleText(block.phase) + ' · ' + rangeText(block.start, block.end)),
    scheduleNode('p', 'details-workspaces', scheduleText('workspace') + ' ' + areas));
  if (!scheduleDetailsDialog.open) scheduleDetailsDialog.showModal();
}
function renderScheduleChrome() {
  document.documentElement.lang = getScheduleLanguage();
  document.title = 'PM Studio｜' + scheduleText('title');
  for (const [id, key] of Object.entries({ 'schedule-title': 'title', 'today-button': 'today', 'legend-production': 'production', 'legend-correction': 'correction', 'pending-title': 'pending', 'page-footer': 'footer', 'retry': 'retry', 'preview-note': 'preview' })) scheduleElement(id).textContent = scheduleText(key);
  scheduleElement('previous').setAttribute('aria-label', scheduleText('previous'));
  scheduleElement('next').setAttribute('aria-label', scheduleText('next'));
  scheduleElement('timeline-viewport').setAttribute('aria-label', scheduleText('timeline'));
  const language = scheduleElement('language-toggle');
  language.textContent = getScheduleLanguage() === 'en' ? '繁體中文' : 'English';
  language.setAttribute('lang', getScheduleLanguage() === 'en' ? 'zh-Hant' : 'en');
  language.setAttribute('aria-label', getScheduleLanguage() === 'en' ? '切換至繁體中文' : 'Switch to English');
  for (const id of ['previous', 'next', 'today-button']) scheduleElement(id).disabled = !scheduleState.payload;
  renderScheduleNotice();
}
function renderScheduleNotice() {
  const notice = scheduleElement('load-notice');
  let key = null;
  if (scheduleState.loading) key = 'loading';
  else if (scheduleState.failed) key = scheduleState.payload ? 'staleError' : 'loadError';
  else if (scheduleState.payload?.warnings.length) key = 'warning';
  else if (scheduleState.payload && !scheduleState.payload.projects.length) key = 'empty';
  notice.hidden = !key;
  notice.classList.toggle('error', scheduleState.failed && !scheduleState.loading);
  notice.classList.toggle('warning', key === 'warning');
  scheduleElement('load-message').textContent = key ? scheduleText(key) : '';
  scheduleElement('retry').hidden = !scheduleState.failed;
  scheduleElement('retry').disabled = scheduleState.loading;
  const payload = scheduleState.payload;
  scheduleElement('sync-status').textContent = payload ? scheduleText(scheduleState.failed ? 'stale' : 'loaded') + ' · ' + scheduleReadTime(payload.syncedAt) + ' (UTC+8)' : '';
}
function renderSchedulePending() {
  const projects = scheduleState.payload.projects.map((project) => ({ project, reasons: projectPendingReasons(project) })).filter((item) => item.reasons.length);
  scheduleElement('pending-section').hidden = !projects.length;
  scheduleElement('pending-count').textContent = String(projects.length);
  const target = scheduleElement('pending-projects');
  target.replaceChildren();
  for (const { project, reasons } of projects) {
    const card = scheduleNode('article', 'pending-card');
    const title = scheduleNode('div', 'card-heading');
    title.append(scheduleNode('span', 'card-id', project.id), scheduleNode('span', 'customer-code', projectIdentity(project)));
    card.append(title, scheduleNode('p', 'pending-reason', reasons.map((reason) => scheduleText(reason)).join(' · ')));
    card.append(scheduleNode('p', 'pending-dates', scheduleText('production') + ' ' + rangeText(project.start, project.end)));
    if (project.correctionStart || project.correctionEnd || reasons.includes('correction-dates')) card.append(scheduleNode('p', 'pending-dates', scheduleText('correction') + ' ' + rangeText(project.correctionStart, project.correctionEnd)));
    target.append(card);
  }
}
function renderScheduleTimeline(preserveScroll = false) {
  const viewport = scheduleElement('timeline-viewport');

  let savedScroll = preserveScroll ? viewport.scrollLeft : 0;
  // Reveal the grid before measuring; a hidden viewport reports zero width.

  const scale = timelineScale(viewport.clientWidth);
  // The browser may already have clamped scrollLeft after a width change.
  const position = preserveScroll && previousScale
    ? previousScale.viewportWidth !== scale.viewportWidth && scheduleState.viewPosition
      ? scheduleState.viewPosition

    : null;
  if (position && previousScale.viewportWidth !== scale.viewportWidth) {
    // Rebase near the visible date so a wider viewport cannot clamp an old right-edge scroll.

  const dayWidth = scale.dayWidth;
  scheduleState.scale = scale;
  scheduleState.layout = layout;
  const canvas = scheduleElement('timeline-canvas');
  canvas.replaceChildren();
  canvas.style.width = layout.width + 'px'; canvas.style.height = layout.height + 'px';
  const labels = scheduleElement('workspace-labels');
  labels.replaceChildren(scheduleNode('div', 'label-axis', scheduleText('workspace')));
  let monthStart = firstDay;
  for (let index = 0; index < TIMELINE_DAYS; index++) {
    const day = firstDay + index;
    const date = new Date(day * 86400000);
    const weekday = date.getUTCDay();
    const grid = scheduleNode('div', 'grid-day' + ([0, 6].includes(weekday) ? ' weekend' : '') + (weekday === 1 ? ' week-start' : ''));
    grid.style.left = index * dayWidth + 'px'; grid.style.width = dayWidth + 'px'; canvas.append(grid);
    if (weekday === 1) {
      const label = scheduleNode('span', 'day-label', String(date.getUTCDate()));
      label.setAttribute('data-date', timelineDate(day));
      label.style.left = index * dayWidth + 'px'; label.style.width = Math.min(7, TIMELINE_DAYS - index) * dayWidth + 'px'; canvas.append(label);
    }
    const nextDate = new Date((day + 1) * 86400000);
    if (nextDate.getUTCDate() === 1 || index === TIMELINE_DAYS - 1) {
      const monthWidth = (day - monthStart + 1) * dayWidth;
      const month = scheduleNode('div', 'month-label', monthWidth >= 90 ? scheduleMonth(monthStart) : '');
      month.setAttribute('title', scheduleMonth(monthStart));
      month.style.left = (monthStart - firstDay) * dayWidth + 'px';
      month.style.width = monthWidth + 'px'; canvas.append(month);
      monthStart = day + 1;
    }
  }
  for (const row of layout.rows) {
    const label = scheduleNode('div', 'workspace-label'); label.style.height = row.height + 'px';
    label.append(scheduleNode('span', 'workspace-letter', row.workspace.id), scheduleNode('span', 'workspace-description', workspaceText(row.workspace.id))); labels.append(label);
    const rule = scheduleNode('div', 'row-rule'); rule.style.top = row.top + row.height + 'px'; canvas.append(rule);
    if (!row.blocks.length) { const empty = scheduleNode('span', 'empty-row', scheduleText('noWork')); empty.style.top = row.top + 43 + 'px'; canvas.append(empty); }
    for (const block of row.blocks) {
      const project = block.project;
      const card = scheduleNode('button', 'project-card' + (block.phase === 'correction' ? ' correction' : ''));
      card.setAttribute('type', 'button');
      card.setAttribute('data-project-id', project.id);
      card.setAttribute('data-phase', block.phase);
      card.style.left = block.left + 'px'; card.style.top = block.top + 'px'; card.style.width = block.width + 'px';
      card.setAttribute('tabindex', '0');
      const identity = project.id + ' · ' + projectIdentity(project);
      const details = identity + ' · ' + scheduleText(block.phase) + ' · ' + rangeText(block.start, block.end) + ' · ' + scheduleText('workspace') + ' ' + project.workspaceIds.join(' + ');
      card.setAttribute('aria-label', details); card.setAttribute('title', details);
      const heading = scheduleNode('div', 'card-heading'); heading.append(scheduleNode('span', 'card-id', project.id), scheduleNode('span', 'customer-code', projectIdentity(project)));
      const content = scheduleNode('span', 'card-content');
      content.append(heading, scheduleNode('span', 'card-dates', rangeText(block.start, block.end)), scheduleNode('span', 'card-meta', scheduleText(block.phase) + ' · ' + project.workspaceIds.join(' + ') + ' · ' + String(project.workspaceUnits[row.workspace.id])));
      card.append(content);
      card.addEventListener('click', () => showScheduleDetails(block));
      canvas.append(card);
    }
  }
  const today = timelineDay(payload.today);
  if (today >= firstDay && today <= layout.lastDay) {
    const line = scheduleNode('div', 'today-line'); line.style.left = (today - firstDay) * dayWidth + 'px';

}
function updateScheduleRange() {

  scheduleState.viewPosition = position;
  const first = position.day;
  const last = Math.min(scheduleState.layout.lastDay, first + scheduleState.scale.visibleDays - 1);
  scheduleElement('date-range').textContent = timelineDate(first) + ' — ' + timelineDate(last);
  const count = new Set(scheduleState.layout.rows.flatMap((row) => row.blocks).filter((block) => block.first <= last && block.last >= first).map((block) => block.project.id)).size;
  scheduleElement('visible-count').textContent = scheduleText('visible', { count });
}
function renderSchedule(preserveScroll = false) {
  renderScheduleChrome();
  if (!scheduleState.payload) return;
  renderScheduleTimeline(preserveScroll);
  renderSchedulePending();
}
async function loadSchedule() {
  if (scheduleState.loading) return;
  scheduleState.loading = true; renderScheduleNotice();
  try {
    const payload = normalizeTimelinePayload(await readSchedule());
    scheduleState.payload = payload;
    if (scheduleState.firstDay === null) scheduleState.firstDay = timelineDay(payload.today) - 4;
    scheduleState.failed = false;
  } catch { scheduleState.failed = true; }
  finally { scheduleState.loading = false; renderSchedule(true); }
}
function shiftSchedule(direction) {
  if (!scheduleState.payload) return;
  const viewport = scheduleElement('timeline-viewport');
  const visibleStart = timelineScrollPosition(scheduleState.firstDay, viewport.scrollLeft, scheduleState.scale.dayWidth).day;
  scheduleState.firstDay = visibleStart + direction * (scheduleState.scale.visibleDays - 7);
  renderScheduleTimeline();
}
try { setScheduleLanguage(localStorage.getItem('pm-studio-language')); } catch { setScheduleLanguage('zh-Hant'); }
scheduleElement('language-toggle').addEventListener('click', () => {
  const language = setScheduleLanguage(getScheduleLanguage() === 'en' ? 'zh-Hant' : 'en');
  try { localStorage.setItem('pm-studio-language', language); } catch { /* Language still changes when storage is unavailable. */ }
  renderSchedule(true);
});
scheduleElement('previous').addEventListener('click', () => shiftSchedule(-1));
scheduleElement('next').addEventListener('click', () => shiftSchedule(1));
scheduleElement('today-button').addEventListener('click', () => { if (!scheduleState.payload) return; scheduleState.firstDay = timelineDay(scheduleState.payload.today) - 4; renderScheduleTimeline(); });
scheduleElement('retry').addEventListener('click', loadSchedule);
scheduleElement('timeline-viewport').addEventListener('scroll', updateScheduleRange, { passive: true });
scheduleElement('timeline-viewport').addEventListener('keydown', (event) => { if (event.key === 'Home') { event.preventDefault(); scheduleElement('today-button').click(); } });
new ResizeObserver(() => {
  const width = scheduleElement('timeline-viewport').clientWidth;
  if (scheduleState.payload && width > 0 && width !== scheduleState.scale?.viewportWidth) renderScheduleTimeline(true);
}).observe(scheduleElement('timeline-viewport'));
renderScheduleChrome();
await loadSchedule();

})();
</script>

<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PM Studio｜團隊專案排程</title>
  <style>
:root {
  font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
  color: #e7e7e7;
  background: #141414;
  font-synthesis: none;
  --text: #e7e7e7;
  --muted: #aaa;
  --subtle: #939393;
  --border: #303030;
  --surface: #191919;
  --focus: #f0f0f0;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 2px; background: transparent; transition: background-color .15s, color .15s, border-color .15s; }
button:hover { color: #fff; }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.app { max-width: 1584px; margin: auto; padding: 32px 56px 28px; }
.app-header { margin-bottom: 40px; }
.header-top { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.language-button { min-height: 40px; padding: 8px 0 8px 12px; color: #bcbcbc; font-size: 12px; }
.language-button::after { content: '↗'; margin-left: 10px; color: #777; }
.language-button:hover { color: #fff; }
h1 { flex-shrink: 0; margin: 0; font-size: 42px; font-weight: 450; line-height: 1.25; letter-spacing: .025em; }
.preview-note { margin: -16px 0 28px; color: var(--muted); font-size: 11px; line-height: 1.6; }
.preview-note::before { content: ''; display: inline-block; width: 5px; height: 5px; margin: 0 9px 2px 0; border-radius: 50%; background: #a4a4a4; }
.schedule { min-width: 0; }
.toolbar { display: flex; align-items: center; justify-content: flex-end; padding: 0 0 24px; }
.date-navigation { display: flex; align-items: center; gap: 8px; }
.date-navigation button { height: 48px; border: 1px solid #606060; border-radius: 6px; background: #2b2b2b; color: #eee; box-shadow: 0 2px 0 #080808, inset 0 1px 0 #ffffff09; }
.date-navigation button:hover { background: #3a3a3a; border-color: #aaa; color: #fff; }
.date-navigation button:active { transform: translateY(1px); background: #222; box-shadow: inset 0 2px 4px #0005; }
.arrow-button { width: 56px; font-size: 22px; }
.date-navigation .today-button { min-width: 88px; padding: 0 24px; border-color: #ddd; background: #ddd; color: #202020; font-size: 13px; font-weight: 650; }
.date-navigation .today-button:hover { border-color: #fff; background: #f4f4f4; color: #111; }
.date-navigation .today-button:active { border-color: #bbb; background: #bbb; color: #111; }
.schedule-key { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 12px 26px; margin-left: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 20px; color: var(--muted); font-size: 11px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 8px; border: 1px solid #777; border-radius: 1px; background: #2c2c2c; }
.legend .correction-key { border-color: #999; background: repeating-linear-gradient(135deg,#4a4a4a,#4a4a4a 1px,#252525 1px,#252525 4px); }
.legend .reservation-key { border: 1px dashed #999; background: #202020; }
.legend .follow-up-key { position: relative; width: 18px; height: 1px; border: 0; background: #aaa; }
.legend .follow-up-key::after { content: ''; position: absolute; right: 0; top: -2px; width: 5px; height: 5px; border-radius: 50%; background: #ddd; }
.visible-count { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.load-notice { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 18px 0; border-top: 1px solid var(--border); color: #ccc; font-size: 13px; line-height: 1.8; }
.load-notice.error, .load-notice.warning { border-left: 2px solid #aaa; padding-left: 16px; }
#retry { padding: 6px 12px; border: 1px solid #555; font-size: 12px; }
.timeline-grid { display: grid; grid-template-columns: 142px minmax(0,1fr); border-top: 1px solid #494949; border-bottom: 1px solid #494949; }
.workspace-labels { z-index: 2; background: #141414; border-right: 1px solid #383838; }
.label-axis { height: 68px; padding: 26px 0; border-bottom: 1px solid var(--border); color: var(--subtle); font-size: 11px; }
.workspace-label { padding: 18px 18px 18px 0; border-bottom: 1px solid var(--border); }
.workspace-label:last-child { border-bottom: 0; }
.workspace-letter { display: block; color: #dedede; font-size: 27px; font-weight: 350; line-height: 1.2; }
.workspace-description { display: block; margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.6; }
.timeline-viewport { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: #515151 #191919; }
.timeline-canvas { position: relative; isolation: isolate; min-height: 420px; background: #171717; }
.grid-day { position: absolute; top: 38px; bottom: 0; z-index: -2; pointer-events: none; }
.grid-day.weekend { background: #ffffff02; }
.grid-day.week-start { border-left: 1px solid #ffffff09; }
.month-label { position: absolute; top: 0; height: 38px; padding: 11px 14px; overflow: hidden; border-left: 1px solid #3b3b3b; border-bottom: 1px solid var(--border); background: #1c1c1c; color: #d0d0d0; font-size: 12px; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.day-label { position: absolute; top: 38px; height: 30px; padding: 8px 0 0 7px; overflow: hidden; color: var(--subtle); text-align: left; font-family: var(--mono); font-size: 10px; }
.row-rule { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--border); pointer-events: none; }
.today-line { position: absolute; top: 38px; bottom: 0; z-index: 2; border-left: 1px solid #a7a7a7; pointer-events: none; }
.today-label { position: absolute; top: 4px; left: 5px; padding: 3px 5px; border-radius: 1px; background: #dedede; color: #191919; font-size: 9px; font-weight: 600; line-height: 1.4; white-space: nowrap; }

.project-card { position:absolute; height:48px; min-width:0; padding:0; text-align:left; }
.card-content { position:absolute; top:6px; bottom:5px; left:12px; right:9px; overflow:hidden; pointer-events:none; }
.card-heading { display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; line-height:17px; white-space:nowrap; }
.project-card .card-heading { padding-right:82px; }
.card-id { flex-shrink:0; font-family:var(--mono); font-size:14px; font-weight:650; line-height:17px; letter-spacing:-.025em; }
.card-meta { display:block; margin-top:2px; padding-right:82px; overflow:hidden; line-height:15px; letter-spacing:-.015em; text-overflow:ellipsis; white-space:nowrap; }
.project-card .project-name { font-size:11px; font-weight:550; line-height:17px; }
.card-phase { position:absolute; top:6px; right:0; flex-shrink:0; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:600; line-height:14px; }
.project-card.correction .card-phase, .project-card.reservation .card-phase { position:static; padding:1px 8px; }
.project-card.correction .card-heading, .project-card.correction .card-meta, .project-card.reservation .card-heading, .project-card.reservation .card-meta { padding-right:0; }
.project-card:hover, .project-card:focus-visible { z-index:6; }
.project-card.is-compact .card-content { left:9px; right:8px; }
.project-card.is-compact .card-heading, .project-card.is-compact .card-meta { padding-right:0; }
.project-card.is-compact .card-phase { display:none; }
.project-card.is-narrow .card-content { visibility:hidden; }
.follow-up-stem { position: absolute; height: 1px; background: #aaa; pointer-events: none; z-index: 1; }
.follow-up-stem.clipped-start::before { content: ''; position: absolute; left: 1px; top: -3px; width: 6px; height: 6px; border-left: 1px solid #aaa; border-bottom: 1px solid #aaa; transform: rotate(45deg); }
.follow-up-endpoint { position: absolute; width: 44px; height: 44px; border: 0; border-radius: 50%; padding: 0; background: transparent; z-index: 3; }
.follow-up-endpoint::before { content: ''; position: absolute; left: 16px; top: 16px; width: 12px; height: 12px; border: 2px solid #ddd; border-radius: 50%; background: #777; box-shadow: 0 0 0 4px #171717; }
.follow-up-endpoint:hover, .follow-up-endpoint:focus-visible { background: #ffffff0a; }
.follow-up-label { position: absolute; left: 39px; top: 13px; padding: 2px 5px; background: #171717; color: #c8c8c8; white-space: nowrap; font-family: var(--mono); font-size: 11px; line-height: 1.4; }
.empty-row { position: absolute; left: 18px; color: var(--subtle); font-size: 11px; }
.timeline-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px 24px; padding: 18px 0 0; color: var(--subtle); font-size: 10px; line-height: 1.6; font-variant-numeric: tabular-nums; }
.sync-status { flex-shrink: 0; }
.pending-section { margin-top: 44px; }
.section-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
h2 { margin: 0; color: #ddd; font-size: 16px; font-weight: 500; }
.count-badge { color: var(--subtle); font-family: var(--mono); font-size: 12px; }
.pending-projects { border-top: 1px solid #494949; }
.pending-card { display: grid; grid-template-columns: minmax(200px,1.25fr) minmax(160px,1fr) minmax(210px,1.1fr) 36px; align-items: center; gap: 22px; min-width: 0; padding: 20px 0; border-bottom: 1px solid var(--border); }
.pending-identity { min-width: 0; }
.pending-card .card-heading { flex-wrap: wrap; gap: 4px 10px; white-space: normal; }
.pending-card .customer-code { display: block; margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
.pending-reason { margin: 0; color: #c4c4c4; font-size: 12px; line-height: 1.8; }
.pending-schedule { min-width: 0; }
.pending-dates { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.9; font-variant-numeric: tabular-nums; }
.pending-details { position: relative; width: 36px; height: 40px; overflow: hidden; font-size: 0; color: #cfcfcf; }
.details-arrow { font-size: 21px; line-height: 1; }
.pending-details:hover { background: #2b2b2b; }
.page-footer { margin-top: 28px; color: var(--subtle); font-size: 11px; line-height: 1.8; }
.project-details { width: min(680px,calc(100vw - 32px)); max-height: calc(100dvh - 40px); padding: 32px; overflow: auto; border: 1px solid #555; border-radius: 5px; background: #1c1c1c; color: var(--text); box-shadow: 0 32px 100px #0008; scrollbar-width: thin; scrollbar-color: #666 #1c1c1c; }
.project-details::backdrop { background: #000b; }
.project-details h2 { padding-right: 40px; color: #f3f3f3; font-size: 24px; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; }
.details-close { position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; color: #bbb; font-size: 24px; line-height: 1; }
.details-close:hover { background: #303030; color: #fff; }
.details-customer { margin: 9px 0 28px; color: var(--muted); font-size: 12px; line-height: 1.8; }
.project-fields { display: grid; grid-template-columns: 126px minmax(0,1fr); gap: 0 24px; margin: 0 0 24px; font-size: 13px; line-height: 1.85; }
.project-fields dt { padding: 13px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.project-fields dd { margin: 0; padding: 13px 0; border-top: 1px solid var(--border); white-space: pre-wrap; overflow-wrap: anywhere; }
.details-dates { font-family: var(--mono); font-size: 12px; line-height: 1.9; }
.details-workspaces { margin: 20px 0 0; color: var(--muted); font-size: 12px; line-height: 1.8; }
.details-statuses { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
.status-tag { padding: 5px 9px; border: 1px solid #666; border-radius: 2px; color: #ddd; font-size: 12px; }
.details-note { color: var(--muted); font-size: 12px; line-height: 1.8; }
@media (max-width: 1050px) {
  .app { padding-left: 32px; padding-right: 32px; }
  .pending-card { grid-template-columns: minmax(180px,1fr) minmax(140px,1fr) 36px; gap: 8px 24px; }
  .pending-schedule { grid-column: 2; }
  .pending-identity { grid-row: 1 / span 2; }
  .pending-details { grid-column: 3; grid-row: 1 / span 2; }
}
@media (max-width: 700px) {
  .app { padding: 20px 20px 24px; }
  .app-header { margin-bottom: 28px; }
  .language-button { min-height: 36px; font-size: 11px; }
  h1 { font-size: 31px; }
  :lang(en) h1 { font-size: clamp(22px,5.8vw,31px); letter-spacing: -.035em; }
  .preview-note { margin: -10px 0 24px; font-size: 10px; }
  .toolbar { padding-bottom: 20px; }
  .date-navigation button { height: 46px; }
  .arrow-button { width: 50px; font-size: 21px; }
  .date-navigation .today-button { min-width: 82px; padding: 0 20px; font-size: 13px; }
  .schedule-key { width: 100%; gap: 12px 16px; margin-left: 0; }
  .legend { gap: 8px 13px; font-size: 10px; }
  .legend span { gap: 5px; }
  .visible-count { font-size: 10px; }
  .timeline-grid { grid-template-columns: 76px minmax(0,1fr); }
  .label-axis { font-size: 10px; }
  .workspace-label { padding: 14px 10px 10px 0; }
  .workspace-letter { font-size: 24px; }
  .workspace-description { margin-top: 5px; font-size: 10px; line-height: 1.5; }
  .month-label { padding-left: 9px; font-size: 11px; }
  .timeline-footer { gap: 14px; padding-top: 16px; font-size: 9px; }
  .pending-section { margin-top: 32px; }
  .section-heading { margin-bottom: 15px; }
  h2 { font-size: 15px; }
  .pending-card { grid-template-columns: minmax(0,1fr) 36px; gap: 8px 12px; padding: 18px 0; }
  .pending-identity { grid-column: 1; grid-row: auto; }
  .pending-reason, .pending-schedule { grid-column: 1; }
  .pending-reason { margin-top: 4px; font-size: 11px; }
  .pending-details { grid-column: 2; grid-row: 1; }
  .pending-dates { font-size: 10px; }
  .project-details { padding: 26px 22px; max-height: calc(100dvh - 24px); }
  .project-details h2 { font-size: 21px; }
  .details-close { top: 14px; right: 14px; }
  .project-fields { grid-template-columns: 1fr; gap: 0; }
  .project-fields dt { padding: 12px 0 4px; font-size: 11px; }
  .project-fields dd { padding: 0 0 12px; border-top: 0; }
  .details-dates { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
}

// Generated from PM Studio sources. No project records are embedded.
(async () => {
const TIMELINE_DAYS = 210;
const TIMELINE_AXIS_HEIGHT = 68;

function timelineScale(viewportWidth) {

}

function timelineDay(value) {
  if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
  const date = new Date(value + 'T00:00:00Z');

  if (typeof value !== 'string' || !/^\d{4}-\d{2}$/.test(value)) return null;

  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(now);

/** The static material remains usable when browser rendering APIs are absent. */
function startScheduleRefraction(doc = document) {
  if (!doc.defaultView?.requestAnimationFrame || !doc.createElementNS) return null;
  const view = doc.defaultView;
  const mount = () => installNeutralRefraction({ root:doc, selector:'.project-glass-surface', strength:4, bezel:7, radius:12 });
  let refraction = mount();
  const hide = () => refraction.destroy();
  const show = event => { if (event.persisted) refraction = mount(); };
  view.addEventListener('pagehide', hide);
  view.addEventListener('pageshow', show);
  return {
    get stats() { return refraction.stats; },
    destroy() {
      view.removeEventListener('pagehide', hide);
      view.removeEventListener('pageshow', show);
      refraction.destroy();
    },
  };
}


const INTERNAL_ONLY_PROJECT_FIELDS = Object.freeze(['name', 'customer', 'contact', 'assignee']);

function normalizeInternalTimelinePayload(payload) {
  if (!payload || typeof payload !== 'object' || !Array.isArray(payload.projects)) throw new Error('Invalid internal schedule.');
  const extras = payload.projects.map((project) => {
    if (!project || typeof project !== 'object' || Array.isArray(project)) throw new Error('Invalid internal project.');
    const fields = {};
    for (const key of INTERNAL_ONLY_PROJECT_FIELDS) {
      if (!Object.hasOwn(project, key) || typeof project[key] !== 'string' || project[key].length > 4000) throw new Error('Invalid internal project text.');

    }
    return fields;
  });
  const publicProjects = payload.projects.map((project) => Object.fromEntries(Object.entries(project).filter(([key]) => !INTERNAL_ONLY_PROJECT_FIELDS.includes(key))));
  const schedule = normalizeTimelinePayload({ ...payload, projects: publicProjects });
  return { ...schedule, projects: schedule.projects.map((project, index) => ({ ...project, ...extras[index] })) };
}
